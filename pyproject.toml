[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iwac-ai-pipelines"
version = "1.1.0"
description = "AI-powered document processing workflows for the Islam West Africa Collection (IWAC)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frédérick Madore" }]
keywords = [
    "digital humanities",
    "omeka-s",
    "large language models",
    "ocr",
    "named entity recognition",
    "handwritten text recognition",
    "digital archives",
    "african studies",
]
# No `License ::` classifier: PEP 639 forbids pairing one with the SPDX field above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Last verified green on 2026-08-27 against: google-genai 2.20.0, openai 2.52.0,
# mistralai 2.8.0, pydantic 2.13.4, pypdf 6.14.2, requests 2.34.2,
# python-dotenv 1.2.2, tqdm 4.70.0, rich 15.0.0, pytest 9.1.1, ruff 0.16.1.
# Upgrade with `pip install --upgrade <names>`, not `--upgrade-strategy eager`:
# eager drags in a cryptography build that has no wheel on Windows ARM64.
dependencies = [
    # AI provider SDKs — pinned to a major version: these break routinely
    # 2.x broke only the Interactions API; generate_content is unchanged.
    # The floor is 2.20 because AI_audio_summary/02c needs the transcription
    # mode types (VerbatimTranscriptionMode, SmartTranscriptionMode): 2.16 has
    # interactions but no `mode` field on TranscriptionConfig, so the request
    # builds and the model silently ignores timestamps and diarization.
    "google-genai>=2.20,<3",
    "openai>=1.60,<4",
    "mistralai>=2.5,<3", # 2.x layout: import from mistralai.client and mistralai.client.errors
    "pydantic>=2.5,<3",
    # PDF processing
    "pypdf>=4,<7", # successor of the deprecated PyPDF2
    # Omeka S integration
    "requests>=2.31,<3",
    # Utilities
    "python-dotenv>=1.0,<2",
    "tqdm>=4.66,<5",
    "rich>=13,<16",
    "pydub>=0.25,<1",
    "audioop-lts; python_version >= '3.13'", # pydub dependency removed from stdlib in 3.13
]

# Keep tables below the bare keys above: TOML assigns every following key to the
# most recent table header, so `[project.urls]` placed earlier would swallow them.
[project.urls]
Homepage = "https://islam.zmo.de/s/westafrica/"
Repository = "https://github.com/fmadore/iwac-ai-pipelines"
Issues = "https://github.com/fmadore/iwac-ai-pipelines/issues"
Dataset = "https://huggingface.co/datasets/fmadore/islam-west-africa-collection"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools]
# Only common/ is an importable package; pipeline scripts are run directly.
packages = ["common"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pragmatic set for a research codebase: real errors and unused code,
# without imposing wholesale stylistic churn.
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = [
    "E402", # module-level import not at top: scripts must mutate sys.path before importing common/
    "E731", # lambda assignments are used deliberately in a few scripts
]

[tool.pytest.ini_options]
testpaths = ["tests"]
